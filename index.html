<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page de profil minimaliste de Guillaume Babin.">
  <title>Guillaume Babin</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- Separate CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Subtle background decoration -->
  <div class="bg-ambient" id="ambientBg"></div>

  <!-- Profile Card container -->
  <main class="profile-card" id="mainProfileCard">
    <!-- Image with modern hover border effect -->
    <div class="photo-container" id="profilePhotoContainer">
      <div class="photo-wrapper">
        <img src="images/gb.jpg" alt="Photo de Guillaume Babin" class="profile-photo" id="profileImage">
      </div>
    </div>

    <!-- User details -->
    <div class="profile-details" id="profileDetailsContainer">
      <h1 class="profile-name" id="userName">Guillaume Babin</h1>
      <div class="separator" id="sectionSeparator"></div>
      <p class="profile-title" id="userTitle">Développeur &amp; Créateur autodidacte</p>
    </div>
  </main>
</body>
</html>
